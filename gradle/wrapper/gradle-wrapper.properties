# Pinned to 8.13, deliberately - do not bump without re-checking Coil.
#
# Gradle 8.14.5 cannot resolve io.coil-kt.coil3 into an Android compile classpath at all: it fails
# with "Problems reading data from Binary store in <gradle-home>/.tmp/<random>.bin offset 0" while
# reading that library's multiplatform module metadata. Reproducible on every run, and unaffected by
# clearing modules-2, clearing the transforms cache, --refresh-dependencies, --no-parallel or
# --no-configuration-cache. Not a network problem - the same coordinates resolve fine on 8.13. This
# is what actually kept the Coil 2.x -> 3.x migration blocked; the earlier "TLS fetch failure"
# diagnosis was wrong.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
