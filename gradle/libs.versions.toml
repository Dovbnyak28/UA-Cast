[versions]
agp = "8.13.2"
kotlin = "2.4.0"
coreKtx = "1.18.0"
splashscreen = "1.2.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
media3 = "1.10.1"
nextlibMedia3ext = "1.10.1-0.13.0"
castFramework = "22.3.1"
okhttp = "5.4.0"
coil = "3.5.0"
profileinstaller = "1.4.1"
baselineprofile = "1.4.1"
benchmarkMacroJunit4 = "1.4.1"
uiautomator = "2.4.0"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestEspresso = "3.6.1"
kotlinxCoroutines = "1.11.0"
appcompat = "1.7.1"
lifecycle = "2.10.0"
fragmentKtx = "1.8.9"
detekt = "1.23.8"
desugarJdkLibs = "2.1.5"
orgJson = "20260719"
leakcanary = "2.14"
robolectric = "4.16"
roborazzi = "1.70.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
# Published to Maven Central under the io.github.anilbeesetti group (verified via
# ./gradlew :app:dependencies --configuration debugRuntimeClasspath); resolves with the
# repo's existing google()+mavenCentral() setup, no JitPack repository needed.
nextlib-media3ext = { group = "io.github.anilbeesetti", name = "nextlib-media3ext", version.ref = "nextlibMedia3ext" }

play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "castFramework" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# coil3, not the io.coil-kt "coil-compose" of Coil 2.x - different group, different package root
# (coil3.*). Coil 2 is end-of-life; 3.x is where fixes land. No coil-network-* artifact is needed
# here: every model handed to AsyncImage is a java.io.File that IconRepository already fetched and
# validated itself (see IconDiskCache), so Coil never performs a network request of its own.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
# Test-only: android.jar's org.json classes are stubbed out (return default/null values) under
# plain JVM unit tests, same as the rest of the Android SDK - this is the real reference
# implementation so BackupCodec's org.json-based (de)serialization is actually exercised by its
# unit tests instead of silently no-op'ing. Never shipped in the APK - the real device always uses
# the platform's own org.json.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
# :baselineprofile module only - generates app/src/main/baseline-prof.txt, never shipped in the app.
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# Debug-only leak detector (never shipped in release). The app previously had NO leak detection at
# all, which is why the double-ExoPlayer leak surfaced only via OOM crashes and manual logcat -
# this makes a retained PlayerViewModel/ExoPlayer visible the moment it happens.
# Backports java.time (and a few other java.util APIs) to the minSdk 24 devices that predate them -
# without this, every java.time call in the app is a NoClassDefFoundError on Android 7.0/7.1, which
# is what android lint's NewApi findings were reporting. See app/build.gradle.kts compileOptions.
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
# The Android runtime jar Robolectric executes against. Pulled through Gradle on purpose - see the
# robolectricSdk configuration in app/build.gradle.kts and docs/SCREENSHOT_TESTING.md. The version
# string is not free-form: it is what DefaultSdkProvider in robolectric 4.16 asks for for API 36
# (androidVersion 16, framework build 13921718, instrumentation revision i7), so it moves only when
# the robolectric version above does.
robolectric-android-all-instrumented = { group = "org.robolectric", name = "android-all-instrumented", version = "16-robolectric-13921718-i7" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
