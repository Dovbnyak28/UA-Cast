org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Maven Central answers HTTP 429 to bursts from shared CI IPs. Gradle retries a failed dependency
# download itself (429 counts as transient), but by default only 3 times, 1 s and 2 s apart - and
# once those fail it disables the repository for the rest of the build, so one throttled POM
# fails everything after it. 6 tries starting at 2 s (doubling: 2, 4, 8, 16, 32 s) ride out a
# burst instead. Measured against a local server that always answers 429: 3 requests in 3 s by
# default, 6 requests over 62 s with these. Gradle-internal properties of
# ErrorHandlingModuleComponentRepository (8.14); an unknown one is simply ignored.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 full mode is more aggressive about assuming no reflection and stricter about visibility
# than the compatibility (default) mode - see the release build/test verification in the commit
# that added this line for what was checked before enabling it.
android.enableR8.fullMode=true
kotlin.code.style=official
# Detekt's Android task registration still uses Kotlin's deprecated android.sourceSets bridge.
# Keep the suppression scoped to that diagnostic; do not silence unrelated Gradle/Kotlin warnings.
# Remove this once Detekt switches to AGP's Variant API (KT-74451).
kotlin.suppressGradlePluginWarnings=SourceSetsAccessInAndroidExtension
