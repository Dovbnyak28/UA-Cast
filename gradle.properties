org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 full mode is more aggressive about assuming no reflection and stricter about visibility
# than the compatibility (default) mode - see the release build/test verification in the commit
# that added this line for what was checked before enabling it.
android.enableR8.fullMode=true
kotlin.code.style=official
# Detekt's Android task registration still uses Kotlin's deprecated android.sourceSets bridge.
# Keep the suppression scoped to that diagnostic; do not silence unrelated Gradle/Kotlin warnings.
# Remove this once Detekt switches to AGP's Variant API (KT-74451).
kotlin.suppressGradlePluginWarnings=SourceSetsAccessInAndroidExtension
