name: Isolated emulator renderer measurements

on:
  push:
    branches: [codex/performance-renderer-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/software-decoder-native.yml
  renderer:
    name: UI measurements (${{ matrix.renderer }})
    runs-on: ubuntu-24.04
    needs: native
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        renderer: [swiftshader, lavapipe, swiftshader_indirect]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: software-decoder-native
          path: ffmpegdecoder/build/native-libraries
      - name: Verify native inputs
        run: python3 scripts/prepare-software-decoder.py --verify-only
      - name: Enable KVM for owned emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure UI journeys with unchanged app and budgets
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.renderer }} -no-snapshot -noaudio -no-boot-anim
          script: >-
            ./gradlew :baselineprofile:connectedBenchmarkReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.uacastplayer.baselineprofile.CriticalJourneysBenchmark
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
            --stacktrace
      - name: Keep raw measurements and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-${{ matrix.renderer }}-evidence
          path: |
            baselineprofile/build/outputs/
            baselineprofile/build/reports/
          if-no-files-found: warn
          retention-days: 14
