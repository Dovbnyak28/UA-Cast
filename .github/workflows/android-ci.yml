name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  UACAST_VERSION_CODE: ${{ github.run_number }}
  UACAST_VERSION_NAME: 0.9.3.${{ github.run_number }}

jobs:
  unit:
    name: Unit tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace -Puacast.versionCode=$UACAST_VERSION_CODE -Puacast.versionName=$UACAST_VERSION_NAME

      - name: Debug unit tests and screenshot verification
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace

      - name: Release unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Compile benchmark harness and verify fixture isolation
        run: |
          ./gradlew \
            :app:compileBenchmarkReleaseKotlin \
            :app:compileNonMinifiedReleaseKotlin \
            :baselineprofile:compileBenchmarkReleaseKotlin \
            :baselineprofile:compileNonMinifiedReleaseKotlin \
            :app:processDebugMainManifest \
            :app:processReleaseMainManifest \
            :app:processBenchmarkReleaseMainManifest \
            :app:processNonMinifiedReleaseMainManifest \
            --stacktrace
          bash scripts/check-benchmark-fixture-isolation.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: app/build/reports
          retention-days: 14

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roborazzi-screenshot-diffs
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Lint, detekt and architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Android lint
        run: ./gradlew :app:lintDebug :app:lintRelease --stacktrace

      - name: Detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Architecture dependency boundaries
        run: bash scripts/check-architecture-boundaries.sh

      - name: Documentation package references
        run: bash scripts/check-doc-references.sh

      - name: Locale-independent formatting
        run: bash scripts/check-locale-format.sh

      - name: Theme color boundaries
        run: |
          bash scripts/check-no-hardcoded-colors.sh
          bash scripts/check-glow-not-text.sh
          bash scripts/check-cast-icon-placement.sh

      - name: Lifecycle and log-safety checks
        run: |
          bash scripts/check-oncleared-super.sh
          bash scripts/check-applog-sensitive-vars.sh

      - name: Premium dependency and gating checks
        run: |
          bash scripts/check-premium-purity.sh
          bash scripts/check-sold-features-are-gated.sh

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release APK, AAB and diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace -Puacast.versionCode=$UACAST_VERSION_CODE -Puacast.versionName=$UACAST_VERSION_NAME

      - name: Version code ordering
        run: bash scripts/check-version-code-ordering.sh

      - name: Bundle release
        run: ./gradlew :app:bundleRelease --stacktrace -Puacast.versionCode=$UACAST_VERSION_CODE -Puacast.versionName=$UACAST_VERSION_NAME

      - name: Bundle Play distribution
        run: ./gradlew :app:bundlePlay --stacktrace -Puacast.versionCode=$UACAST_VERSION_CODE -Puacast.versionName=$UACAST_VERSION_NAME

      - name: Generate dependency report
        run: |
          mkdir -p app/build/reports/release-diagnostics
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > app/build/reports/release-diagnostics/dependencies.txt

      - name: Generate APK Analyzer and size reports
        run: |
          mkdir -p app/build/reports/release-diagnostics
          : > app/build/reports/release-diagnostics/apk-analyzer.txt
          : > app/build/reports/release-diagnostics/sizes.txt
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" apk summary "$apk" >> app/build/reports/release-diagnostics/apk-analyzer.txt
            stat --printf='%n %s bytes\n' "$apk" >> app/build/reports/release-diagnostics/sizes.txt
          done
          stat --printf='%n %s bytes\n' app/build/outputs/bundle/release/*.aab >> app/build/reports/release-diagnostics/sizes.txt
          stat --printf='%n %s bytes\n' app/build/outputs/bundle/play/*.aab >> app/build/reports/release-diagnostics/sizes.txt

      - name: Compare APK size with previous successful run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/build/reports/release-diagnostics/previous
          previous_run=$(gh run list --workflow android-ci.yml --branch "${{ github.ref_name }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" --name app-release-unsigned --dir app/build/reports/release-diagnostics/previous || true
          fi
          current=$(find app/build/outputs/apk/release -name '*.apk' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          previous=$(find app/build/reports/release-diagnostics/previous -name '*.apk' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          {
            printf 'current_apk_bytes=%s\n' "$current"
            printf 'previous_apk_bytes=%s\n' "$previous"
            if [ "$previous" -gt 0 ]; then printf 'diff_bytes=%s\n' "$((current-previous))"; fi
          } > app/build/reports/release-diagnostics/size-diff.txt

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-bundle-unsigned
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Play bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-play-bundle-unsigned
          path: app/build/outputs/bundle/play/*.aab
          retention-days: 14

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/
            app/build/outputs/mapping/play/mapping.txt
            app/build/outputs/native-debug-symbols/play/
            app/build/reports/release-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 30, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-instrumented-tests.sh

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: app/build/reports/
          retention-days: 14
