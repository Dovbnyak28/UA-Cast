name: Android CI

on:
  push:
    # Both, deliberately: the work actually lives on master (there is no main branch in this
    # repository), so a main-only trigger meant this workflow could never fire on a push. main is
    # kept alongside it so renaming the default branch later doesn't silently disable CI again.
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only ever reads the repository and uploads artifacts; nothing here needs write access
# to code, issues or packages. Declared explicitly because the default for GITHUB_TOKEN depends on a
# repository setting rather than on this file.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The full gate takes a handful of minutes. Without a cap, a hung Gradle daemon or a test that
    # waits on something that never arrives burns the runner's 6-hour default before failing.
    timeout-minutes: 45
    env:
      # versionCode must increase monotonically across releases; the CI run number does that for
      # free. versionName stays human-readable but gets the run number appended so each CI build
      # is traceable back to the workflow run that produced it.
      UACAST_VERSION_CODE: ${{ github.run_number }}
      UACAST_VERSION_NAME: 0.3.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # 21, not 17, because of Robolectric. Its SDK table records a required Java version per
      # Android API level, and API 36 - this app's targetSdk, so what the screenshot and other
      # Robolectric tests run against - demands 21. From DefaultSdkProvider in robolectric 4.16,
      # disassembled: the API 36 entry is ("16", "13921718", "REL", 21), that last field being the
      # required JDK. On 17 every Robolectric test refuses to start; nothing else here needs the
      # bump. The app itself is still compiled to Java 17 bytecode (see app/build.gradle.kts), so
      # this changes what Gradle runs on, not what is shipped.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace -Puacast.versionCode=$UACAST_VERSION_CODE -Puacast.versionName=$UACAST_VERSION_NAME

      # verifyRoborazziDebug *is* testDebugUnitTest with golden verification switched on, so this
      # runs the whole debug unit-test suite and the screenshot comparison in one pass rather than
      # running the suite twice. A golden mismatch surfaces as an ordinary test failure
      # (DesignSystemScreenshotTest > emptyState_cinema FAILED).
      #
      # The goldens in this repository were recorded on Windows and this is the first time they are
      # checked on Linux. Robolectric renders through the Skia and fonts bundled in the android-all
      # jar - the same artifact on every platform, which is the reason to expect them to match - but
      # cross-platform antialiasing differences are a known failure mode for screenshot testing in
      # general. If this step fails on a diff rather than a real regression, compare the uploaded
      # images below and re-record on this runner; see docs/SCREENSHOT_TESTING.md.
      - name: Unit tests and screenshot verification
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace

      - name: Release unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      # Both variants, because lint is per-variant and this build ships the release one. The release
      # variant merges a different manifest and runs with a different set of build-config values, so
      # lintDebug alone leaves exactly the APK that gets uploaded unchecked. It also keeps this job
      # equal to the gate run locally before a commit - otherwise "green locally" and "green in CI"
      # quietly mean two different things.
      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Lint (release)
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Locale-independent formatting check
        run: bash scripts/check-locale-format.sh

      - name: No hardcoded colors outside ui/theme check
        run: bash scripts/check-no-hardcoded-colors.sh

      - name: Glow colors not used as text/icon foregrounds check
        run: bash scripts/check-glow-not-text.sh

      - name: ViewModel onCleared() calls super check
        run: bash scripts/check-oncleared-super.sh

      - name: AppLog sensitive-variable check
        run: bash scripts/check-applog-sensitive-vars.sh

      # Compile-only - there's no emulator/device here to actually run instrumentation tests
      # against (see MainActivitySmokeTest).
      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Assemble release (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace -Puacast.versionCode=$UACAST_VERSION_CODE -Puacast.versionName=$UACAST_VERSION_NAME

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports
          retention-days: 14

      # Without these a golden mismatch is just a failed assertion with nothing to look at - and
      # since the goldens were recorded on a different OS than this runner, "what actually differs"
      # is the first question anyone will have. Roborazzi writes *_compare.png (side by side, diff
      # highlighted) and *_actual.png here; the directory is gitignored.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshot-diffs
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
