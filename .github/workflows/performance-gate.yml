name: Measured performance gate

on:
  pull_request:
    branches: [master]
    paths:
      - 'app/**'
      - 'core/**'
      - 'baselineprofile/**'
      - 'ffmpegdecoder/**'
      - 'config/performance/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/check-performance-budgets.py'
      - 'scripts/tests/test_performance_budgets.py'
      - 'scripts/prepare-software-decoder.py'
      - 'scripts/build-ffmpeg-android.sh'
      - 'scripts/patches/**'
      - '.github/workflows/software-decoder-native.yml'
      - '.github/workflows/performance-gate.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  # Superseded PR measurements cannot validate the new revision; keep weekly/manual runs intact.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    uses: ./.github/workflows/software-decoder-native.yml

  device-budgets:
    runs-on: ubuntu-24.04
    needs: native
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0, Node 24
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0, Node 24
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0, Node 24
      - name: Download verified native inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: software-decoder-native
          path: ffmpegdecoder/build/native-libraries
      - name: Verify native inputs
        run: python3 scripts/prepare-software-decoder.py --verify-only
      - name: Test evidence validator and host allocation/complexity budgets
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_performance_budgets.py'
          ./gradlew :app:testReleaseUnitTest --tests '*HomeContentPerformanceTest' --tests '*ChannelSearchPerformanceTest' --tests '*PlaylistParsePerformanceTest' --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure eight journeys and sleeping-display readiness on an owned fresh emulator
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          # API35 traces contain completed DrawFrames but unfinished FrameTimeline slices.
          # API30 uses the standard UI/RenderThread CPU metric without synthetic frame samples.
          # Both independent API30 probes returned all eight journeys; limits stay unchanged.
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim
          script: >-
            ./gradlew :baselineprofile:connectedBenchmarkReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.uacastplayer.baselineprofile.StartupBenchmark,com.uacastplayer.baselineprofile.CriticalJourneysBenchmark,com.uacastplayer.baselineprofile.EpgParseBenchmark,com.uacastplayer.baselineprofile.BenchmarkFixtureReadinessTest
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
            --stacktrace
      - name: Enforce complete measured budgets
        run: python3 scripts/check-performance-budgets.py baselineprofile/build/outputs
      - name: Preserve measurements, traces and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: performance-api30-evidence
          path: |
            baselineprofile/build/outputs/
            baselineprofile/build/reports/
            app/build/test-results/testReleaseUnitTest/
          if-no-files-found: error
          retention-days: 30
