name: Verified software decoder native build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    # Keep the SDK-equipped image stable while ubuntu-latest migrates to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Validate fail-closed native build guards
        run: python3 -m unittest discover -s scripts/tests -p 'test_software_decoder_build.py'
      - name: Install pinned Android native toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''ndk;26.1.10909125'' ''cmake;3.22.1'''
      - name: Build from hash-verified sources, not a decoder AAR
        run: |
          python3 scripts/prepare-software-decoder.py \
            --ndk "$ANDROID_HOME/ndk/26.1.10909125" \
            --cmake "$ANDROID_HOME/cmake/3.22.1/bin/cmake" \
            --ninja "$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          python3 scripts/prepare-software-decoder.py --verify-only
          python3 scripts/package-software-decoder-source.py
          python3 scripts/verify-software-decoder-bundle.py
      - name: Upload verified native inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: software-decoder-native
          path: ffmpegdecoder/build/native-libraries/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: software-decoder-corresponding-source
          path: build/software-decoder-dist/
          if-no-files-found: error
          retention-days: 30
      - name: Build isolated modified-library relink probe
        run: python3 scripts/prepare-software-decoder-relink-probe.py
      - name: Upload test-only replacement library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: software-decoder-relink-probe-test-only
          path: build/software-decoder-relink-probe/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native compiler logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: software-decoder-native-evidence
          path: ffmpegdecoder/build/native-bootstrap/**/*.log
          if-no-files-found: ignore
          retention-days: 14
