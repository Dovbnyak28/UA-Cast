name: Build signed Play artifact

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Play versionCode
        required: true
        type: string
      version_name:
        description: User-visible versionName (for example 0.9.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-play-release
  cancel-in-progress: false

jobs:
  signed-play-bundle:
    name: Signed Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      RELEASE_VERSION_NAME: ${{ inputs.version_name }}
      UACAST_KEYSTORE_BASE64: ${{ secrets.UACAST_KEYSTORE_BASE64 }}
      UACAST_STORE_PASSWORD: ${{ secrets.UACAST_STORE_PASSWORD }}
      UACAST_KEY_ALIAS: ${{ secrets.UACAST_KEY_ALIAS }}
      UACAST_KEY_PASSWORD: ${{ secrets.UACAST_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Validate release inputs and materialize keystore
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer" >&2
            exit 1
          }
          [[ "$RELEASE_VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || {
            echo "version_name contains unsupported characters" >&2
            exit 1
          }
          for name in UACAST_KEYSTORE_BASE64 UACAST_STORE_PASSWORD UACAST_KEY_ALIAS UACAST_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || {
              echo "Required production secret is missing: $name" >&2
              exit 1
            }
          done
          keystore="$RUNNER_TEMP/uacast-release.p12"
          printf '%s' "$UACAST_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          [ -s "$keystore" ] || {
            echo "Decoded keystore is empty" >&2
            exit 1
          }
          echo "UACAST_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Run release gate and build signed Play bundle
        run: >-
          ./gradlew
          :app:verifyRoborazziDebug
          :app:testPlayUnitTest
          :app:lintPlay
          :app:detekt
          :app:bundlePlay
          --stacktrace
          -Puacast.requireSigning=true
          -Puacast.versionCode=$RELEASE_VERSION_CODE
          -Puacast.versionName=$RELEASE_VERSION_NAME

      - name: Verify architecture, premium and Play policy surfaces
        shell: bash
        run: |
          bash scripts/check-detekt-baseline.sh
          bash scripts/check-architecture-boundaries.sh
          bash scripts/check-doc-references.sh
          bash scripts/check-locale-format.sh
          bash scripts/check-no-hardcoded-colors.sh
          bash scripts/check-glow-not-text.sh
          bash scripts/check-cast-icon-placement.sh
          bash scripts/check-oncleared-super.sh
          bash scripts/check-applog-sensitive-vars.sh
          bash scripts/check-premium-purity.sh
          bash scripts/check-sold-features-are-gated.sh
          bash scripts/check-play-distribution.sh
          bash scripts/check-legal-assets.sh app/build/outputs/bundle/play

      - name: Verify bundle signature
        shell: bash
        run: |
          set -euo pipefail
          bundle=$(find app/build/outputs/bundle/play -maxdepth 1 -type f -name '*.aab' -print -quit)
          [ -n "$bundle" ] || {
            echo "Signed Play bundle was not produced" >&2
            exit 1
          }
          verification=$(LC_ALL=C jarsigner -verify "$bundle")
          if ! grep -F 'jar verified.' <<< "$verification" >/dev/null; then
            echo "Play bundle signature verification did not report success" >&2
            exit 1
          fi

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-aab-signed-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: app/build/outputs/bundle/play/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-play-diagnostics-${{ inputs.version_code }}
          path: |
            app/build/outputs/mapping/play/mapping.txt
            app/build/outputs/native-debug-symbols/play/
          if-no-files-found: ignore
          retention-days: 30
